name: Multi-system integration
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  stack:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GOWORK: "off"
      GOPROXY: "https://proxy.golang.org|direct"
      GODEBUG: http2client=0
      MES_MYSQL_DSN: root:runner@tcp(127.0.0.1:3306)/multi_system_mes_demo
      MYSQL_TEST_PASSWORD: runner
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: runner
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install Redis and MySQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y redis-server default-mysql-client
          sudo systemctl start redis-server
      - name: Build both web applications and the MCP server
        run: |
          for app in mes-web mes-orders-mcp yq-tablehandle-system/frontend; do
            (cd "$app" && npm ci --registry=https://registry.npmjs.org --replace-registry-host=always && npm run build)
          done
      - name: Build and test Go and Java services
        run: |
          make test build
          (cd newGoService/demo && go test ./... && go build -o ../../.bin/go-demo .)
          (cd yq-tablehandle-system/backend && go test ./... && go build -o ../../.bin/table-agent .)
          (cd hello-api && ./mvnw --batch-mode verify)
      - name: Verify the MES queue and all running applications
        run: |
          make integration db-init
          python3 scripts/actions_stack.py
