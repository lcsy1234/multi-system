server:
  address: "127.0.0.1:8004"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

socket:
  address: "127.0.0.1:8005"

logger:
  level: "all"
  stdout: true

# Asynq 消费配置，修改后重启 listener 生效。
worker:
  groups:
    default:
      redis:
        addr: "127.0.0.1:6379" # REDIS_ADDR 可覆盖
        password: "" # REDIS_PASSWORD 可覆盖
        db: 0
      servers:
        - concurrency: 1 # 并发任务数
          queues:
            mes-material: 1 # 队列名及消费权重
